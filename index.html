<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Dashboard V2</title>
<style>
body{font-family:system-ui;background:#f3f6f1;margin:20px}
.card{background:#fff;border-radius:12px;padding:16px;max-width:900px;margin:12px auto;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border:1px solid #ddd;border-radius:8px;padding:6px;min-height:54px;font-size:12px}
.low{background:#ffd9d9}.mid{background:#fff2b3}.high{background:#dff7d8}
label{display:block;margin:4px 0}
select{padding:6px}
</style>
<body>
<div class="card">
<h2>🌿 Health Dashboard V2</h2>
<div id="today"></div>
<label>今日运动：
<select id="sport">
<option>无</option><option>💪 力量</option><option>🩰 普拉提</option><option>❤️ 有氧</option>
<option>🥊 拳击</option><option>🥾 徒步</option><option>🏃 跑步</option>
<option>🚴 骑行</option><option>🏊 游泳</option><option>🧘 恢复</option>
</select></label>
<h3>今日打卡</h3>
<div id="tasks"></div>
<p>完成率：<b id="rate">0%</b></p>
</div>

<div class="card">
<h3>📅 本月日历（演示版）</h3>
<div class="grid" id="cal"></div>
</div>

<div class="card">
<h3>📊 本周汇总（演示版）</h3>
<div id="week"></div>
</div>

<script>
const list=["😴 睡眠7.5h","🌙 0:30前睡","🥚 两个鸡蛋","🥛 牛奶/酸奶","🍎 水果","💧 饮水2L","🧘 拉伸","🎥 视频练习"];
const t=document.getElementById("tasks");
list.forEach((x,i)=>{
 let l=document.createElement("label");
 l.innerHTML=`<input type=checkbox data-i="${i}"> ${x}`;
 t.appendChild(l);
});
const d=new Date();
document.getElementById("today").textContent=d.toLocaleDateString("zh-CN");
const key="health-"+d.toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem(key)||"{}");
if(data.sport) sport.value=data.sport;
document.querySelectorAll("input").forEach((c,i)=>{
 c.checked=data["c"+i]||false;
 c.onchange=save;
});
sport.onchange=save;
function save(){
 let done=0,total=document.querySelectorAll("input").length;
 let obj={sport:sport.value};
 document.querySelectorAll("input").forEach((c,i)=>{obj["c"+i]=c.checked;if(c.checked)done++;});
 localStorage.setItem(key,JSON.stringify(obj));
 let p=Math.round(done/total*100);
 rate.textContent=p+"%";
 drawCal();
 week.innerHTML=`完成率：${p}%<br>今日运动：${sport.value}`;
}
function drawCal(){
 cal.innerHTML="";
 const days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
 for(let i=1;i<=days;i++){
   let div=document.createElement("div");
   div.className="day";
   const k=`health-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(i).padStart(2,"0")}`;
   let o=JSON.parse(localStorage.getItem(k)||"{}");
   let cnt=0;
   for(let j=0;j<8;j++) if(o["c"+j]) cnt++;
   let pct=Math.round(cnt/8*100);
   div.classList.add(pct<40?"low":pct<80?"mid":"high");
   div.innerHTML=`<b>${i}</b><br>${o.sport||""}<br>${pct||0}%`;
   cal.appendChild(div);
 }
}
save();
</script>
</body></html>
